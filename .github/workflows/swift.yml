name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-format:
    name: Check source code formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
            swift format --in-place --recursive Sources Tests
            if test -n "$(git ls-files -m)"; then
              echo 'Some files were not properly formatted, please run `swift format --in-place --recursive Sources Tests`'
              git status
              exit 1;
            fi
  build-doc:
    name: Build documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation
        run: |
            swift package --allow-writing-to-directory docs \
                 generate-documentation \
                 --target Biscuits \
                 --disable-indexing \
                 --transform-for-static-hosting \
                 --output-path docs
  build:
    name: Build and test on ${{ matrix.os }}
    strategy:
      matrix:
        # TODO re-enable ubuntu-latest
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test
      - name: Run tests without default traits
        run: swift test --disable-default-traits

  licenses:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DASH_VERSION: 1.1.0
      DASH_SHA256: ba4e84e1981f0e51f92a42ec8fc8b9668dabb08d1279afde46b8414e11752b06

    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: swift package resolve
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Eclipse Dash license tool
        id: dash-cache
        uses: actions/cache@v4
        with:
          path: dash-licenses.jar
          key: dash-licenses-${{ env.DASH_VERSION }}
      - name: Download the Eclipse Dash license tool
        if: steps.dash-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o dash-licenses.jar \
            https://clementd-files.cellar-c2.services.clever-cloud.com/org.eclipse.dash.licenses-$DASH_VERSION.jar
      - name: Verify the Eclipse Dash license tool
        run: echo "$DASH_SHA256  dash-licenses.jar" | sha256sum -c
      - name: Check dependency licenses
        # the tool exits with the number of dependencies that are not approved
        shell: bash
        run: |
          jq -r '.pins[]
                 | (.location | sub("^https://github.com/"; "git/github/") | sub("\\.git$"; ""))
                   + "/" + .state.revision' Package.resolved \
            | java -jar dash-licenses.jar -summary DEPENDENCIES -
      - name: Upload the license summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-licenses
          path: DEPENDENCIES
